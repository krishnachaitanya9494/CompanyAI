<!doctype html>
<!-- Set document language to English -->
<html lang="en">
  <head>
    <!-- Specify character encoding for unicode characters -->
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon link using standard SVG data URI -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310B981'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <!-- Application title for browser tab -->
    <title>CompanyAI Agent | Recruitment Workspace</title>
    <!-- Preconnect to Google Fonts for Inter font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <!-- Set dark navy text and light neutral background on the body -->
  <body class="bg-surface-50 text-navy-900 font-sans antialiased selection:bg-brand-100 selection:text-brand-700">
    <!-- Root container element where React will mount the application -->
    <div id="root"></div>
    <!-- Entry point script for Vite bundling -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
